version: "3"

vars:
  LINTER_VER: "v2.13.1"

tasks:
  run:
    desc: "Run tests, race detection, and linters"
    deps:
      - test-race
      - lint

  test:
    desc: "Run unit tests"
    cmds:
      - go test ./...

  test-race:
    desc: "Run unit tests with the race detector"
    cmds:
      - go test -race ./...

  lint:
    desc: "Run golangci-lint in Docker"
    cmds:
      - >-
        docker run --rm
        -v "{{.ROOT_DIR}}:/app"
        -w /app
        golangci/golangci-lint:{{.LINTER_VER}}
        golangci-lint run
